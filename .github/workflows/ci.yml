name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: socra
          POSTGRES_PASSWORD: socra
          POSTGRES_DB: socra
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U socra -d socra"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://socra:socra@localhost:5544/socra?schema=public
      REDIS_URL: redis://localhost:6390
      SESSION_SECRET: ci-only-session-secret-0000000000000000000000
      RESEARCH_PSEUDONYM_SECRET: ci-only-pseudonym-secret-00000000000000000
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
